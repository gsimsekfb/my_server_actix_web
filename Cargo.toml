[package]
name = "actix_hello"
version = "0.1.0"
edition = "2024"

[features]
disable_logs = []
enable_tracing_spans = []

# Enable "debug .." line for faster incr. builds
#
# debug = "line-tables-only" keeps just enough debug info for backtraces/line
# numbers without full variable-inspection data, which is faster to generate
# than full debug info.
[profile.dev]
opt-level = 0
# debug = "line-tables-only"

[dependencies]
actix-http = "3.12.1"
actix-session = { version = "0.11", features = ["cookie-session"] }
actix-web = "4"
dashmap = "6.1.0"
derive_more = "2.1.1"
env_logger = "0.11.9"
futures = "0.3.31"
futures-util = "0.3.31"
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["hmac", "sha2"] }
log = "0.4.29"
metrics = "0.24.6"
metrics-exporter-prometheus = "0.18.3"
num-bigint-dig = "0.9.1"
proptest = "1.11.0"
prost = "0.13"
reqwest = { version = "0.13.4", features = ["json"] }
serde = "1.0.228"
serde_json = "1.0.149"
tokio = "1.52.1"
tonic = "0.13"
tonic-reflection = "0.13"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["fmt", "time", "env-filter"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
mockito = "1.7.2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-build = "0.13"

[[bench]]
name = "allocation"
harness = false

[lints.clippy]
four_forward_slashes = "allow"

[[bin]]
name = "twin"
path = "src/tw_main_fn.rs"

